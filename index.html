<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VoltMart · Demo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Persistent demo notice: this build is non-functional and uses sample data -->
<div class="demo-strip" role="note">
  <span class="demo-strip__tag">DEMO</span>
  <span data-i18n="demoStrip">Educational UI study — non-functional, sample data only. No payments are processed.</span>
</div>

<div id="app" class="shell"></div>

<!-- Modal / sheet host -->
<div id="overlay" class="overlay" hidden>
  <div id="overlay-card" class="overlay__card" role="dialog" aria-modal="true"></div>
</div>

<!-- Toast host -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
